
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAVA | NDC Learning</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef3f9;color:#172b4d}
.app{max-width:850px;height:100dvh;margin:auto;display:flex;flex-direction:column;background:white;box-shadow:0 0 25px #cbd5e1}
header{background:#103b70;color:white;padding:18px 22px}
header h2{margin:0;font-size:23px}
header p{margin:6px 0 0;font-size:13px;color:#dbeafe}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:85%;padding:13px 16px;border-radius:16px;line-height:1.55;font-size:14px;white-space:pre-line}
.bot{background:#edf3fa;align-self:flex-start}
.user{background:#1459a1;color:white;align-self:flex-end}
.suggestions{display:flex;gap:8px;flex-wrap:wrap;padding:10px 18px}
.suggestions button{border:1px solid #bfd3ed;border-radius:20px;background:#fff;color:#15518e;padding:9px;cursor:pointer}
footer{display:flex;gap:8px;padding:14px;border-top:1px solid #e2e8f0}
input{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:10px;padding:13px;font-size:14px}
footer button{background:#1559a6;color:white;border:0;border-radius:10px;padding:0 20px;cursor:pointer}
small{display:block;text-align:center;color:#64748b;padding:5px 10px 12px}
</style>
</head>
<body>
<div class="app">
<header>
<h2>✦ NAVA</h2>
<p>NDC Learning Virtual Assistant · Learn Together. Grow Together. Make an Impact.</p>
</header>

<div class="chat" id="chat"></div>
<div class="suggestions" id="suggestions"></div>
<footer>
<input id="question" placeholder="Tanyakan sesuatu tentang NDC Learning..." aria-label="Pertanyaan">
<button onclick="send()">Kirim</button>
</footer>
<small>Jawaban berdasarkan modul pengetahuan NDC Learning</small>
</div>

<script>

</script>
<script src="knowledge.js"></script>
<script>


const chat=document.getElementById("chat");
const input=document.getElementById("question");

function message(text,type){
const div=document.createElement("div");
div.className="msg "+type;
div.textContent=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

function normalize(text){
return text.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").trim();
}

function answer(question){
const q=normalize(question);
let best=null,score=0;
for(const item of knowledge){
let s=0;
for(const keyword of item.keywords){
const k=normalize(keyword);
if(q.includes(k))s+=k.includes(" ")?4:2;
}
if(s>score){score=s;best=item;}
}
if(!best||score===0){
return "Maaf, saya belum menemukan informasi tersebut dalam modul pengetahuan NDC Learning. Silakan tanyakan tentang program, webinar, simulasi industri, soft skill, atau pengembangan karier.";
}
return best.answer;
}

function send(value){
const q=(value||input.value).trim();
if(!q)return;
message(q,"user");
input.value="";
setTimeout(()=>message(answer(q),"bot"),250);
}

input.addEventListener("keydown",e=>{
if(e.key==="Enter")send();
});

const topics=[
"Program NDC Learning",
"Webinar",
"Simulasi Industri",
"Pengembangan Karier"
];
const suggestions=document.getElementById("suggestions");
topics.forEach(topic=>{
const b=document.createElement("button");
b.textContent=topic;
b.onclick=()=>send(topic);
suggestions.appendChild(b);
});

message("Halo! Saya NAVA, asisten virtual NDC Learning. 👋\n\nSaya siap membantu menjawab pertanyaan berdasarkan modul pengetahuan NDC Learning.\n\nSilakan pilih topik atau ketik pertanyaan kamu.","bot");
</script>
</body>
</html>
